[project]
name = "instrumentaleval-replication"
version = "0.1.0"
description = "Replication of 'Evaluating the Paperclip Maximizer' (He et al., 2025) via OpenRouter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "scipy>=1.13",
    "tqdm>=4.66",
]

[project.scripts]
ie = "instrumentaleval.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/instrumentaleval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
