<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instrumental Rate explorer</title>
<!-- Generated by `ie interactive` (instrumentaleval-replication); data inlined below. Do not edit by hand. -->
<style>
:root {
  --bg: #ffffff; --surface-2: #f4f4f2; --ink: #0b0b0b; --ink-2: #52514e; --muted: #8a8984;
  --grid: #e6e5e0; --axis: #52514e; --accent: #b509ac; --mark: #fff3b0; --mark-ink: #0b0b0b;
  --rlhf: #2f5f9e; --rlhf-fill: #8da9cd; --rl: #3a9a5b; --rl-fill: #95c8a5;
  --paper: #e34948; --ref: #8a8984; --hole: #cfcec9; --tip-bg: #ffffff; --tip-border: #d9d8d2;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #1c1c1d; --surface-2: #26262a; --ink: #ececea; --ink-2: #b4b3ae; --muted: #85847f;
  --grid: #34343a; --axis: #9a9994; --accent: #2698ba; --mark: #5b4b12; --mark-ink: #fff6d6;
  --rlhf: #7ea6dc; --rlhf-fill: #3c5679; --rl: #67c08a; --rl-fill: #335f45;
  --paper: #ff6b6a; --ref: #b4b3ae; --hole: #4a4a50; --tip-bg: #26262a; --tip-border: #424246;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.45 Roboto, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; padding: 4px 2px 8px; }
.wrap { max-width: 1000px; margin: 0 auto; }
.controls { display: grid; gap: 10px; margin-bottom: 10px; }
.row { display: grid; gap: 5px; }
.row > .lab { font-size: 13.5px; font-weight: 500; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { font: inherit; font-size: 15px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--grid);
  border-radius: 6px; padding: 5px 10px; cursor: pointer; line-height: 1.25; text-align: left; }
.seg button small { display: block; font-size: 12.5px; color: var(--muted); }
.seg button[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent);
  background: var(--bg); font-weight: 500; }
.seg button:focus-visible, .col:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
details { border: 1px solid var(--grid); border-radius: 6px; padding: 6px 10px; }
details summary { cursor: pointer; font-size: 15px; color: var(--ink-2); }
.prompt { white-space: pre-wrap; font: 14px/1.5 ui-monospace, Consolas, Menlo, monospace; margin: 6px 0 2px; }
.prompt mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }
.opts { font-size: 15px; color: var(--ink-2); display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 15px; color: var(--ink-2); margin: 4px 0 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 10px; border-radius: 2px; display: inline-block; border: 1.5px solid; }
.ptitle { font-weight: 700; font-size: 16.5px; margin: 10px 0 0; }
.psub { font-size: 15px; color: var(--ink-2); margin: 0; min-height: 22px; }
.cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 18px; }
@media (max-width: 760px) { .cats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .cats { grid-template-columns: 1fr; } }
svg { display: block; width: 100%; overflow: visible; }
svg text { fill: var(--ink-2); font-size: 13px; }
.legend svg { width: auto; display: inline-block; }
svg text.v { fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--tip-bg); color: var(--ink);
  border: 1px solid var(--tip-border); border-radius: 6px; padding: 8px 10px; font-size: 14px; line-height: 1.4;
  box-shadow: 0 4px 14px rgba(0,0,0,.12); max-width: 300px; opacity: 0; transition: opacity .1s; }
#tip b { font-weight: 600; }
#tip .m { color: var(--ink-2); }
@media (prefers-reduced-motion: reduce) { #tip { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="controls">
    <div class="row"><span class="lab" id="lab-step">System prompt</span>
      <div class="seg" id="steps" role="radiogroup" aria-labelledby="lab-step"></div></div>
    <div class="row"><span class="lab" id="lab-judge">Judge</span>
      <div class="seg" id="judges" role="radiogroup" aria-labelledby="lab-judge"></div></div>
    <details id="promptbox"><summary>System prompt at this step (<span id="addedlab">new text highlighted</span>)</summary>
      <div class="prompt" id="prompt"></div></details>
  </div>

  <div class="legend" id="legend"></div>
  <div class="opts"><label><input type="checkbox" id="ref"> GPT-4o, full prompt reference</label></div>

  <p class="ptitle" id="title"></p>
  <p class="psub" id="avgline"></p>
  <div id="main"></div>
  <div class="cats" id="cats"></div>

</div>
<div id="tip" role="tooltip"></div>

<script>
const DATA = /*__DATA__*/null;
(() => {
  "use strict";
  const NS = "http://www.w3.org/2000/svg";
  const REF = { judge: DATA.judges[0].key, step: "nudge" };
  const state = { step: "nudge", judge: DATA.judges[0].key, ref: false };
  const params = new URLSearchParams(location.search);  // ?step=<variant>&judge=<key>&ref=1 opens on that view
  if (DATA.steps.some(s => s.variant === params.get("step"))) state.step = params.get("step");
  if (DATA.judges.some(j => j.key === params.get("judge"))) state.judge = params.get("judge");
  state.ref = params.get("ref") === "1";
  document.getElementById("ref").checked = state.ref;
  const models = DATA.models, fams = Object.keys(DATA.families);
  const $ = id => document.getElementById(id);
  const el = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  };
  const pct = x => (Math.round(x * 10) / 10).toFixed(1);
  const stepOf = v => DATA.steps.find(s => s.variant === v);
  const judgeOf = k => DATA.judges.find(j => j.key === k);
  const cell = (j, v, m) => DATA.cells[j][v][m];

  // ---------------------------------------------------------------- theme: follow the parent page (al-folio)
  function parentTheme() {
    try { return window.parent !== window ? window.parent.document.documentElement.getAttribute("data-theme") : null; }
    catch (e) { return null; }  // cross-origin parent
  }
  function applyTheme() {
    const q = new URLSearchParams(location.search).get("theme");
    const t = q || parentTheme() || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
  }
  applyTheme();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
  try {
    if (window.parent !== window)
      new MutationObserver(applyTheme).observe(window.parent.document.documentElement,
                                               { attributes: true, attributeFilter: ["data-theme"] });
  } catch (e) { /* cross-origin parent: keep the media query */ }

  // ---------------------------------------------------------------- controls
  function seg(container, items, current, onPick) {
    container.innerHTML = "";
    items.forEach((it, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.setAttribute("role", "radio"); b.dataset.key = it.key;
      b.innerHTML = it.html;
      b.setAttribute("aria-checked", it.key === current); b.tabIndex = it.key === current ? 0 : -1;
      b.addEventListener("click", () => onPick(it.key));
      b.addEventListener("keydown", ev => {
        const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[ev.key];
        if (!d) return;
        ev.preventDefault();
        const nxt = items[(i + d + items.length) % items.length].key;
        onPick(nxt);
        container.querySelector(`[data-key="${CSS.escape(nxt)}"]`).focus();
      });
      container.appendChild(b);
    });
  }
  const coverage = (j, v) => models.filter(m => !cell(j, v, m.key).missing).length;
  function renderControls() {
    seg($("steps"), DATA.steps.map(s => ({ key: s.variant,
      html: `${s.label}<small>${coverage(state.judge, s.variant)}/${models.length} models</small>` })),
      state.step, k => update({ step: k }));
    seg($("judges"), DATA.judges.map(j => ({ key: j.key,
      html: `${j.label}<small>${coverage(j.key, state.step)}/${models.length} models</small>` })),
      state.judge, k => update({ judge: k }));
    const p = $("prompt"); p.innerHTML = "";
    const step = stepOf(state.step);
    step.prompt.forEach(([text, added]) => {
      const n = added ? document.createElement("mark") : document.createTextNode(text);
      if (added) n.textContent = text;
      p.appendChild(n);
    });
    $("addedlab").textContent = state.step === DATA.steps[0].variant ? "the starting point"
                                                                      : "text added at this step highlighted";
  }

  $("ref").addEventListener("change", e => update({ ref: e.target.checked }));

  function renderLegend() {
    const L = $("legend"); L.innerHTML = "";
    const add = html => { const s = document.createElement("span"); s.innerHTML = html; L.appendChild(s); };
    fams.forEach(f => add(`<i class="sw" style="background:var(--${f.toLowerCase()}-fill);border-color:var(--${f.toLowerCase()})"></i>${DATA.families[f].name}`));
    add(`<svg width="22" height="10"><line x1="1" x2="21" y1="5" y2="5" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 3"/></svg>group avg`);
    if (state.step === "nudge")
      add(`<svg width="12" height="12"><path d="M6 1 L11 6 L6 11 L1 6Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/></svg>paper`);
    if (state.ref) add(`<svg width="18" height="10"><line x1="1" x2="17" y1="5" y2="5" stroke="var(--ref)" stroke-width="3"/></svg>GPT-4o, full prompt reference`);
    add(`<svg width="14" height="12"><rect x="1" y="1" width="12" height="10" rx="2" fill="none" stroke="var(--hole)" stroke-dasharray="3 2"/></svg>no data`);
  }

  // ---------------------------------------------------------------- panels
  const panels = [];   // {svg, row ("Total" | code), geom, items: {model: {...}}, avg: {fam: {...}}}
  function buildPanel(host, row, opts) {
    host.innerHTML = "";
    const W = Math.max(260, host.clientWidth || 600), H = opts.height;
    const m = { l: 38, r: 8, t: 16, b: opts.labels ? (opts.values ? (W < 420 ? 86 : 76) : 70) : 8 };
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" }, host);
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    const slots = models.length + 1, sw = pw / slots;
    const bw = Math.min(opts.maxBar, sw * 0.66);
    const xs = {}; let i = 0, prev = null;
    models.forEach(md => { if (prev && md.family !== prev) i += 1; xs[md.key] = m.l + sw * (i + 0.5); i += 1; prev = md.family; });
    const y = v => m.t + ph * (1 - v / 100);
    for (const t of [0, 25, 50, 75, 100]) {
      el("line", { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: t ? "var(--grid)" : "var(--axis)", "stroke-width": 1 }, svg);
      const tx = el("text", { x: m.l - 6, y: y(t) + 3.5, "text-anchor": "end" }, svg); tx.textContent = t;
    }
    const famRange = {};
    fams.forEach(f => { const ks = models.filter(md => md.family === f).map(md => xs[md.key]);
                        famRange[f] = [Math.min(...ks) - sw * 0.45, Math.max(...ks) + sw * 0.45]; });
    const gBand = el("g", {}, svg), gBars = el("g", {}, svg), gTop = el("g", {}, svg);
    const avg = {};
    fams.forEach(f => {
      const [x1, x2] = famRange[f];
      avg[f] = { band: el("rect", { x: x1, width: x2 - x1, fill: "var(--ink)", opacity: 0 }, gBand),
                 line: el("line", { x1, x2, stroke: "var(--ink)", "stroke-width": 2, "stroke-dasharray": "6 4", opacity: 0 }, gTop) };
    });
    const items = {};
    models.forEach(md => {
      const x = xs[md.key], f = md.family.toLowerCase();
      const it = {
        hole: el("rect", { x: x - bw / 2, y: m.t, width: bw, height: ph, rx: 3, fill: "none", stroke: "var(--hole)",
                           "stroke-dasharray": "4 3", opacity: 0 }, gBars),
        holeTx: el("text", { x, y: m.t + ph / 2, "text-anchor": "middle", transform: `rotate(-90 ${x} ${m.t + ph / 2})`,
                             opacity: 0, "font-size": 12.5 }, gBars),
        bar: el("path", { fill: `var(--${f}-fill)`, stroke: `var(--${f})`, "stroke-width": 1.5 }, gBars),
        ci: el("line", { x1: x, x2: x, stroke: "var(--ink)", "stroke-width": 1.2 }, gTop),
        ref: el("line", { x1: x - bw / 2 - 3, x2: x + bw / 2 + 3, stroke: "var(--ref)", "stroke-width": 3, opacity: 0 }, gTop),
        paper: el("path", { fill: "var(--paper)", stroke: "var(--ink)", "stroke-width": 1.2, opacity: 0 }, gTop),
        val: opts.values ? el("text", { x, "text-anchor": "middle", "font-size": 13.5, class: "v" }, gTop) : null,
        cur: null,
      };
      it.holeTx.textContent = "no data";
      const hit = el("rect", { x: x - sw / 2, y: m.t, width: sw, height: ph, fill: "transparent", class: "col" }, svg);
      if (opts.focusable) { hit.setAttribute("tabindex", 0); hit.setAttribute("aria-label", md.name); }
      const show = ev => showTip(ev, md, row, hit);
      hit.addEventListener("pointermove", show); hit.addEventListener("pointerenter", show);
      hit.addEventListener("pointerleave", hideTip); hit.addEventListener("focus", show); hit.addEventListener("blur", hideTip);
      if (opts.labels) {
        const ly = H - m.b + 12;
        const rot = opts.values ? -35 : -45;
        const t = el("text", { x, y: ly, "text-anchor": "end", transform: `rotate(${rot} ${x} ${ly})`,
                               "font-size": opts.values && W >= 420 ? 13 : 12 }, svg);
        t.textContent = opts.values ? md.name : md.abbr;
      }
      items[md.key] = it;
    });
    const p = { svg, row, y, bw, xs, items, avg, famRange, ph, top: m.t };
    panels.push(p);
    return p;
  }

  // values for one panel row under a (judge, step): model -> {rate, lo, hi, k, n} | null
  function rowValues(j, v, row) {
    const out = {};
    models.forEach(md => {
      const c = cell(j, v, md.key);
      if (c.missing) { out[md.key] = null; return; }
      if (row === "Total") out[md.key] = { rate: 100 * c.k / c.n, lo: c.lo, hi: c.hi, k: c.k, n: c.n };
      else { const q = c.cats[row]; out[md.key] = q ? { rate: 100 * q[0] / q[1], lo: q[2], hi: q[3], k: q[0], n: q[1] } : null; }
    });
    return out;
  }
  function famAverage(j, v, row) {
    const res = {};
    fams.forEach(f => {
      const a = DATA.averages[j][v][f];
      if (!a) { res[f] = null; return; }
      const vals = rowValues(j, v, row);
      const rates = a.models.map(k => vals[k]).filter(Boolean).map(q => q.rate);
      if (!rates.length) { res[f] = null; return; }
      const mean = rates.reduce((s, r) => s + r, 0) / rates.length;
      res[f] = row === "Total" ? { avg: a.avg, lo: a.lo, hi: a.hi, of: a.models.length } : { avg: mean, of: a.models.length };
    });
    return res;
  }

  // ---------------------------------------------------------------- drawing with tweened values
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const lerp = (a, b, t) => a + (b - a) * t;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function barPath(x, w, y0, y1) {
    const h = y0 - y1;
    if (h <= 0.5) return `M${x - w / 2},${y0}H${x + w / 2}`;
    const r = Math.min(3, h);
    return `M${x - w / 2},${y0}V${y1 + r}Q${x - w / 2},${y1} ${x - w / 2 + r},${y1}H${x + w / 2 - r}Q${x + w / 2},${y1} ${x + w / 2},${y1 + r}V${y0}Z`;
  }
  // A panel's drawn state, in data units (so it survives a re-layout): per model {rate, lo, hi, op}, per family
  // {avg, lo, hi, op}, and the paper / reference markers {v, op}. Every frame draws a mix of two such states and
  // keeps it, so a click during a transition starts from what is on screen.
  const NONE = { v: null, op: 0 };
  function target(p) {
    const vals = rowValues(state.judge, state.step, p.row), refs = state.ref ? rowValues(REF.judge, REF.step, p.row) : {};
    const avgs = famAverage(state.judge, state.step, p.row);
    const S = { bars: {}, paper: {}, ref: {}, avg: {} };
    models.forEach(md => {
      const v = vals[md.key];
      S.bars[md.key] = v ? { rate: v.rate, lo: v.lo, hi: v.hi, op: 1 } : { rate: 0, lo: 0, hi: 0, op: 0 };
      const pap = state.step === "nudge" && md.paper ? (p.row === "Total" ? md.paper.ir : md.paper.cats[p.row]) : null;
      S.paper[md.key] = pap != null ? { v: pap, op: 1 } : NONE;
      S.ref[md.key] = refs[md.key] ? { v: refs[md.key].rate, op: 1 } : NONE;
    });
    fams.forEach(f => {
      const a = avgs[f];
      S.avg[f] = a ? { avg: a.avg, lo: a.lo ?? null, hi: a.hi ?? null, op: 1 } : { avg: null, lo: null, hi: null, op: 0 };
    });
    return S;
  }
  // a value that exists on one side only stays where it is and fades
  const lerpOpt = (a, b, t) => a == null ? b : b == null ? a : lerp(a, b, t);
  const mixMarker = (A, B, t) => ({ v: lerpOpt(A.v, B.v, t), op: lerp(A.op, B.op, t) });
  function mix(A, B, t) {
    const S = { bars: {}, paper: {}, ref: {}, avg: {} };
    models.forEach(({ key: k }) => {
      const a = A.bars[k], b = B.bars[k];
      S.bars[k] = { rate: lerp(a.rate, b.rate, t), lo: lerp(a.lo, b.lo, t), hi: lerp(a.hi, b.hi, t), op: lerp(a.op, b.op, t) };
      S.paper[k] = mixMarker(A.paper[k], B.paper[k], t);
      S.ref[k] = mixMarker(A.ref[k], B.ref[k], t);
    });
    fams.forEach(f => {
      const a = A.avg[f], b = B.avg[f];
      S.avg[f] = { avg: lerpOpt(a.avg, b.avg, t), lo: lerpOpt(a.lo, b.lo, t), hi: lerpOpt(a.hi, b.hi, t),
                   op: lerp(a.op, b.op, t) };
    });
    return S;
  }
  function drawPanel(p, S) {
    models.forEach(md => {
      const it = p.items[md.key], b = S.bars[md.key], x = p.xs[md.key];
      it.bar.setAttribute("d", barPath(x, p.bw, p.y(0), p.y(b.rate)));
      it.bar.setAttribute("opacity", b.op);
      it.ci.setAttribute("y1", p.y(b.lo)); it.ci.setAttribute("y2", p.y(b.hi)); it.ci.setAttribute("opacity", b.op);
      it.hole.setAttribute("opacity", 1 - b.op); it.holeTx.setAttribute("opacity", (1 - b.op) * (p.row === "Total" ? 1 : 0));
      if (it.val) {
        it.val.setAttribute("y", p.y(Math.max(b.hi, b.rate)) - 6); it.val.setAttribute("opacity", b.op);
        it.val.textContent = pct(b.rate);
      }
      const pap = S.paper[md.key];
      if (pap.v != null) { const py = p.y(pap.v); it.paper.setAttribute("d", `M${x},${py - 6}L${x + 6},${py}L${x},${py + 6}L${x - 6},${py}Z`); }
      it.paper.setAttribute("opacity", pap.op);
      const rf = S.ref[md.key];
      if (rf.v != null) { it.ref.setAttribute("y1", p.y(rf.v)); it.ref.setAttribute("y2", p.y(rf.v)); }
      it.ref.setAttribute("opacity", 0.9 * rf.op);
    });
    fams.forEach(f => {
      const a = S.avg[f], g = p.avg[f];
      if (a.avg != null) { const yv = p.y(a.avg); g.line.setAttribute("y1", yv); g.line.setAttribute("y2", yv); }
      g.line.setAttribute("opacity", a.op);
      if (a.lo != null) {  // the 95% CI band, overall panel only
        g.band.setAttribute("y", p.y(a.hi)); g.band.setAttribute("height", Math.max(0, p.y(a.lo) - p.y(a.hi)));
      }
      g.band.setAttribute("opacity", a.lo != null ? 0.08 * a.op : 0);
    });
  }
  const DURATION = 750;  // ms
  const shown = new Map();  // panel row -> the state last drawn
  let anim = null;
  function render(animate) {
    const to = new Map(panels.map(p => [p.row, target(p)]));
    const from = new Map(panels.map(p => [p.row, shown.get(p.row) || to.get(p.row)]));
    if (anim) cancelAnimationFrame(anim);
    const t0 = performance.now(), dur = animate && !reduced ? DURATION : 0;
    const frame = now => {
      const t = dur ? Math.min(1, (now - t0) / dur) : 1;
      panels.forEach(p => {
        const S = mix(from.get(p.row), to.get(p.row), ease(t));
        drawPanel(p, S); shown.set(p.row, S);
      });
      anim = t < 1 ? requestAnimationFrame(frame) : null;
    };
    frame(t0);
  }

  // ---------------------------------------------------------------- text around the chart
  function renderText() {
    const j = judgeOf(state.judge), s = stepOf(state.step);
    $("title").textContent = (j.strict ? "Strict rate (% judged clear)" : "Instrumental Rate") +
      `, all ${DATA.n_tasks} tasks · ${s.label} · judge: ${j.label}`;
    const av = famAverage(state.judge, state.step, "Total");
    $("avgline").textContent = fams.map(f => {
      const a = av[f]; if (!a) return `${DATA.families[f].name} avg: not shown`;
      const of = a.of < models.filter(m => m.family === f).length ? ` (${a.of} of ${models.filter(m => m.family === f).length} models)` : "";
      return `${DATA.families[f].name} avg ${pct(a.avg)} %${of}`;
    }).join("   ·   ");
  }
  // ---------------------------------------------------------------- tooltip
  const tip = $("tip");
  function showTip(ev, md, row, hit) {
    const c = cell(state.judge, state.step, md.key), j = judgeOf(state.judge), s = stepOf(state.step);
    const catName = row === "Total" ? "All tasks" : DATA.categories.find(q => q.code === row).name;
    let h = `<b>${md.name}</b> <span class="m">· ${DATA.families[md.family].name}${md.note ? " · " + md.note : ""}</span><br>`;
    h += `<span class="m">${catName} · ${s.label} · ${j.label}</span><br>`;
    if (c.missing) h += c.missing;
    else {
      const q = row === "Total" ? [c.k, c.n, c.lo, c.hi] : c.cats[row];
      h += `<b>${pct(100 * q[0] / q[1])} %</b> (${q[0]}/${q[1]})<br><span class="m">95% CI ${pct(q[2])}–${pct(q[3])}</span>`;
    }
    if (state.step === "nudge" && md.paper) h += `<br><span class="m">Paper (${md.paper.name}): ${pct(row === "Total" ? md.paper.ir : md.paper.cats[row])} %</span>`;
    if (state.ref) { const r = rowValues(REF.judge, REF.step, row)[md.key]; if (r) h += `<br><span class="m">GPT-4o, full prompt: ${pct(r.rate)} %</span>`; }
    tip.innerHTML = h; tip.style.opacity = 1;
    let x, y;
    if (ev && ev.clientX != null && ev.type !== "focus") { x = ev.clientX; y = ev.clientY; }
    else { const b = hit.getBoundingClientRect(); x = b.left + b.width / 2; y = b.top + 20; }
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.min(window.innerWidth - tw - 6, Math.max(6, x + 12)) + "px";
    tip.style.top = Math.min(window.innerHeight - th - 6, Math.max(6, y + 12)) + "px";
  }
  function hideTip() { tip.style.opacity = 0; }

  // ---------------------------------------------------------------- layout, state, embedding
  function layout() {
    panels.length = 0;
    buildPanel($("main"), "Total", { height: 330, labels: true, values: true, maxBar: 40, focusable: true });
    const cats = $("cats"); cats.innerHTML = "";
    DATA.categories.forEach(c => {
      const box = document.createElement("div");
      box.innerHTML = `<p class="ptitle">${c.name} (${c.code})</p>`;
      const host = document.createElement("div"); box.appendChild(host); cats.appendChild(box);
      buildPanel(host, c.code, { height: 230, labels: true, values: false, maxBar: 22, focusable: false });
    });
    render(anim !== null);
  }
  function update(patch) {
    Object.assign(state, patch);
    renderControls(); renderLegend(); renderText(); render(true);
  }
  if (window.parent !== window) document.documentElement.style.overflow = "hidden";
  renderControls(); renderLegend(); renderText(); layout();
  let lastW = document.body.clientWidth;
  new ResizeObserver(() => {
    const w = document.body.clientWidth;
    if (Math.abs(w - lastW) > 4) { lastW = w; layout(); }
    if (window.parent !== window)
      window.parent.postMessage({ type: "ir-explorer-height", height: Math.ceil(document.body.getBoundingClientRect().height) }, "*");
  }).observe(document.body);
})();
</script>
</body>
</html>
